name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Chrome is preinstalled on all three runner images, so the browser tests run rather than skip.
      - run: node bin/enrichr.mjs doctor
      - run: npm test
